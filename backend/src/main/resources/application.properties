spring.application.name=certech-api
spring.profiles.default=local
server.port=${PORT:8080}
# Do not accept client-supplied Forwarded / X-Forwarded-* as network identity.
server.forward-headers-strategy=none
server.max-http-request-header-size=${HTTP_MAX_HEADER_SIZE:16KB}
server.tomcat.connection-timeout=${HTTP_CONNECTION_TIMEOUT:10s}
server.tomcat.keep-alive-timeout=${HTTP_KEEP_ALIVE_TIMEOUT:15s}
# Bound a rejected body's drain; the application filter enforces JSON body size.
server.tomcat.max-swallow-size=${HTTP_MAX_SWALLOW_SIZE:16KB}
app.http.max-body-bytes=${HTTP_MAX_BODY_BYTES:16384}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
app.contact.rate-limit.max-requests=${CONTACT_RATE_LIMIT_MAX_REQUESTS:5}
app.contact.rate-limit.window-seconds=${CONTACT_RATE_LIMIT_WINDOW_SECONDS:60}

# Queue every persisted contact, but never send until explicitly enabled.
app.notifications.enabled=${CONTACT_NOTIFICATIONS_ENABLED:false}
app.notifications.recipient=${CONTACT_NOTIFICATIONS_TO:prodbydsceron@gmail.com}
app.notifications.from=${CONTACT_NOTIFICATIONS_FROM:}
app.notifications.zone=${CONTACT_NOTIFICATIONS_ZONE:America/Bogota}
app.notifications.max-attempts=${CONTACT_NOTIFICATIONS_MAX_ATTEMPTS:5}
app.notifications.retry-seconds=${CONTACT_NOTIFICATIONS_RETRY_SECONDS:60}
app.notifications.max-retry-seconds=${CONTACT_NOTIFICATIONS_MAX_RETRY_SECONDS:3600}
app.notifications.lease-seconds=${CONTACT_NOTIFICATIONS_LEASE_SECONDS:300}
app.notifications.batch-size=${CONTACT_NOTIFICATIONS_BATCH_SIZE:1}
app.notifications.poll-ms=${CONTACT_NOTIFICATIONS_POLL_MS:60000}
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
# Contact availability depends on durable registration, not the SMTP provider.
management.health.mail.enabled=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}
spring.mail.properties.mail.debug=false
