services:
  postgres:
    image: postgres:16-alpine
    container_name: certech-postgres
    environment:
      POSTGRES_DB: certech
      POSTGRES_USER: certech
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "5434:5432"
    volumes:
      - certech-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certech -d certech"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  certech-postgres-data:
